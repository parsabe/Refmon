[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refmon"
version = "2.0.0"
description = "Platform-agnostic pipeline that detects, contains and explains attacks on endpoints and servers by judging behaviour, not signatures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "cryptography>=42"]

[project.scripts]
refmon = "refmon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/refmon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
