# Malicious variants the pipeline allows, and why. Phase 7 documented nine for v1.0; the evaluation of
# v1.3 on seed 654514256 (docs/v1.3-evaluation.md) still allowed eight. Each entry names the
# dimension levels a variant must carry and the scenarios it is documented for. The Phase 7 test
# fails on an allowed variant that no entry covers, and on an entry that covers nothing.
gaps:
  - id: G1
    finding: F2
    reason: >
      A trusted destination class (a popular host) and an actor that carries no label at the moment of
      the connection. A trusted class still excuses a process without a label (A48), and two things
      leave the actor without one: the events are further apart than the story quiet window, so the
      request label has decayed to nothing before the connection is made (no Contract evidence ever
      froze it), or the entry role was changed to a channel role (a launcher), which never carries a
      label and has no exec contract. Nothing is left to fail. The answer is a narrow list of trusted
      classes, not a rule. S18 (seed 711829743, with timing beyond the window): the fan-out goes to the
      trusted class, so it is neither a fetch (the actor lost its label) nor `lateral` (which counts
      internal classes only).
      Seed 545728926 (v1.6): the same holds for S07 and S25 with typed delivery or a launcher
      entry; the connecting process has no external lineage at all, so v1.5's lineage rule (A60)
      does not reach it.
      Seed 171139148 (v2.0): also S05, a command typed by hand (no origin label at all, the known
      gap of the catalog) whose connection goes to the trusted class; nothing fails.
    match: {destination: popular_trusted}
    scenarios: [S05, S07, S13, S18, S25]
  - id: G2
    finding: F3
    reason: >
      Slow execution: the changes are minutes apart. The hour-scale window works (60 distinct files in
      an hour are significant under the long-window baseline), but this stand-in changes 55 files in
      all, so however it is spread it cannot reach the threshold, and the request label has decayed
      before the end. Catching it needs a lower long-window baseline, which is an expert estimate
      (A29, A49) that only a pilot can set without fitting it to this stand-in.
    match: {timing: minutes}
    scenarios: [S19]
  - id: G3
    finding: F3
    reason: >
      Same as G2 with the events further apart than the story quiet window (one change per story, no
      Contract evidence ever arises to keep the label alive).
    match: {timing: beyond_window}
    scenarios: [S19]
  - id: G4
    finding: F3
    reason: >
      Slow leak (seeds 711829743 and 616687759): the oversized responses of S27 are more than the
      story quiet window apart. Each lands in a story of its own, the request label has decayed
      below the origin threshold by the first one, and at most two responses share the hour-scale
      window, which is not significant under the repeat test. What is left is a single
      `effect_response_anomaly` per story (L = -5.41, below the hold threshold). CUSUM covers volume
      only, not this per-client repeat.
    match: {timing: beyond_window}
    scenarios: [S27]
  - id: G5
    finding: F3
    reason: >
      Slow leak with the oversized responses of S27 minutes apart but inside the story quiet window
      (seed 171139148, v2.0: gap 508 s). The story keeps Origin and Effect, but the request label has
      faded, so Origin counts at its decayed strength (C11.4) and L = -4.96, 0.02 nats under the hold
      threshold (-4.94); the repeat test does not fire for responses this far apart. Moving a weight
      or a threshold for it would fit the rule to this seed (C11, weight methodology).
    match: {timing: minutes}
    scenarios: [S27]
